<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Satoshi;src:url(../../assets/fonts/Satoshi-Black.woff2) format('woff2');font-weight:900}
@font-face{font-family:Satoshi;src:url(../../assets/fonts/Satoshi-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:Satoshi;src:url(../../assets/fonts/Satoshi-Regular.woff2) format('woff2');font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#fff;
     font-family:Satoshi;text-transform:uppercase;letter-spacing:-.07em;
     -webkit-font-smoothing:antialiased;display:flex}
.left{flex:1;padding:74px 0 74px 76px;display:flex;flex-direction:column;justify-content:space-between}
.name{font-weight:500;font-size:26px;line-height:.9}
.head{position:relative;font-weight:900;font-size:86px;line-height:.86;max-width:560px}
.rose{position:absolute;left:-8px;top:-30px;width:92px}
.tags{font-weight:400;font-size:21px;line-height:.9;letter-spacing:-.01em;display:flex;gap:18px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:#000}
.art{width:470px;position:relative;background:#927989;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;max-width:none;display:block}
</style></head><body>
  <div class="left">
    <div class="name">Ushna Imran</div>
    <div class="head"><img class="rose" src="../../assets/img/hero-rose.webp">Crafting ideas that matter</div>
    <div class="tags"><span>Branding</span><i class="dot"></i><span>UI/UX</span><i class="dot"></i><span>Social</span><i class="dot"></i><span>(2d) Animation</span></div>
  </div>
  <div class="art"><img src="../../assets/img/hero-illustration.webp"></div>
</body></html>
